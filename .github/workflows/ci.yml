name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values: the build must not need real credentials.
      # Without SUPABASE_* the app falls back to the local JSON store.
      ANTHROPIC_API_KEY: sk-ant-ci-dummy
      WHATSAPP_VERIFY_TOKEN: ci-dummy
      WHATSAPP_APP_SECRET: ci-dummy
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Evals (offline, recorded model outputs)
        run: npm run evals
      - name: Build
        run: npm run build
